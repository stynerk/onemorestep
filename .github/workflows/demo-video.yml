name: demo-video

# 데모 영상 자동 녹화(#99). video/** 브랜치에 푸시할 때만 돈다. 공개 시연 주소만 열고 비밀값을 쓰지 않는다.
on:
  push:
    branches: ["video/**"]

permissions:
  contents: read

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Korean fonts and ffmpeg
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji ffmpeg
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Record
        run: npx playwright test -c video/playwright.config.ts
      - name: Convert to MP4 and sample frames
        if: always()
        run: |
          mkdir -p out/frames
          src=$(find video-out -name '*.webm' | head -n 1)
          echo "source: $src"
          ffmpeg -y -i "$src" -c:v libx264 -pix_fmt yuv420p -crf 20 -preset medium -movflags +faststart out/mirinae-demo.mp4
          ffmpeg -y -i out/mirinae-demo.mp4 -vf fps=1/5,scale=960:-1 out/frames/f%03d.png
          ffprobe -v error -show_entries format=duration -of default=nw=1 out/mirinae-demo.mp4 | tee out/duration.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-video
          path: out/
          retention-days: 7
